name: Nightly Docker Build and Push

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      source_maps:
        description: "Build only the frontend with source maps (always rebuild)"
        type: boolean
        default: false

jobs:
  nightly-build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.source_maps && '["linkstash-frontend"]' || '["linkstash-backend","linkstash-frontend"]') }}
    env:
      SOURCE_MAPS: ${{ github.event_name == 'workflow_dispatch' && inputs.source_maps && matrix.project == 'linkstash-frontend' && 'true' || 'false' }}
      SKIP_BUILD: 'false'

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 3: Prepare image metadata and select the image variant
    - name: Prepare image metadata
      id: date
      run: |
        DATE=$(date -u +'%Y%m%d')
        SUFFIX=""
        if [ "$SOURCE_MAPS" = "true" ]; then
          SUFFIX="-sourcemaps"
          echo "Source maps requested. Building the frontend without a revision check."
        fi

        echo "IMAGE_TAG=nightly-${DATE}${SUFFIX}" >> "$GITHUB_ENV"
        echo "LATEST_TAG=latest${SUFFIX}" >> "$GITHUB_ENV"
        echo "TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
        echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    # Step 4: Pull latest Docker image and inspect labels
    - name: Pull latest Docker image
      id: check-latest-image
      if: env.SOURCE_MAPS != 'true'
      run: |
        IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ matrix.project }}-nightly:latest

        if docker pull "$IMAGE" 2>/dev/null; then
          LABEL_REVISION=$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' || echo "")

          if [ "$LABEL_REVISION" = "${{ env.REVISION }}" ]; then
            echo "Matching revision found. Skipping build and push."
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "Revision mismatch or label not found. Proceeding with build and push."
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi
        else
          echo "Image not found. Proceeding with build and push."
          echo "SKIP_BUILD=false" >> $GITHUB_ENV
        fi

    # Step 5: Build the Docker image (conditionally)
    - name: Build Docker image
      if: env.SKIP_BUILD != 'true'
      run: |
        BUILD_ARGS=()
        if [ "${{ matrix.project }}" = "linkstash-frontend" ]; then
          BUILD_ARGS+=(--build-arg "LINKSTASH_SOURCE_MAPS=$SOURCE_MAPS")
        fi

        docker build \
                ./apps/${{ matrix.project }} \
                "${BUILD_ARGS[@]}" \
                -t "${{ secrets.DOCKER_USERNAME }}/${{ matrix.project }}-nightly:$IMAGE_TAG" \
                -t "${{ secrets.DOCKER_USERNAME }}/${{ matrix.project }}-nightly:$LATEST_TAG" \
                --label "org.opencontainers.image.created=${{ env.TIMESTAMP }}" \
                --label "org.opencontainers.image.version=$IMAGE_TAG" \
                --label "org.opencontainers.image.revision=${{ env.REVISION }}"

    # Step 6: Push the Docker image (conditionally)
    - name: Push Docker image
      if: env.SKIP_BUILD != 'true'
      run: |
        docker push "${{ secrets.DOCKER_USERNAME }}/${{ matrix.project }}-nightly:$IMAGE_TAG"
        docker push "${{ secrets.DOCKER_USERNAME }}/${{ matrix.project }}-nightly:$LATEST_TAG"

    # Step 7: Log skipping build and push (optional for debugging)
    - name: Skipping build and push
      if: env.SKIP_BUILD == 'true'
      run: echo "Build and push skipped because the latest image revision matches the current git commit."
